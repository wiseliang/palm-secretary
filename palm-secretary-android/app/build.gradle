plugins {
    id 'com.android.application'
}

android {
    namespace 'cloud.wiseliang.palmsecretary'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'cloud.wiseliang.palmsecretary'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.13.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/audit-complete-20260829
    paths:
      - "palm-secretary-android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: palm-secretary-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug
      - name: Verify APK signature
        run: |
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: palm-secretary-v0.13.2-android
          path: palm-secretary-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/audit-complete-20260829
    paths:
      - "palm-secretary-android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: palm-secretary-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
      - name: Verify APK signature
        run: |
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: palm-secretary-v0.13.2-android
          path: palm-secretary-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "掌心助理-v0.13.2-安卓内测版.apk"
          gh release view android-v0.13.2 >/dev/null 2>&1 || \
            gh release create android-v0.13.2 --target "$GITHUB_SHA" --prerelease --title "掌心助理 v0.13.2 Android 内测版" --notes "自动构建并通过 APK 签名校验的 Android 内测安装包。"
          gh release upload android-v0.13.2 "掌心助理-v0.13.2-安卓内测版.apk" --clobber

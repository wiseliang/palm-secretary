name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'palm-secretary-android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: palm-secretary-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and lint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: palm-secretary-android-debug
          path: palm-secretary-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


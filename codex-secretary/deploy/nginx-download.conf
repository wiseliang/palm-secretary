# Enable only after DNS-only A record download.wiseliang.cloud -> 43.143.235.124
# and a publicly trusted certificate covering download.wiseliang.cloud exist.
server {
    listen 80;
    server_name download.wiseliang.cloud;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/palm-acme; }
    location / { return 301 https://download.wiseliang.cloud$request_uri; }
    access_log off;
}
server {
    listen 443 ssl http2;
    server_name download.wiseliang.cloud;
    ssl_certificate /etc/letsencrypt/live/download.wiseliang.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/download.wiseliang.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    location = /api/files/direct {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:4511;
        proxy_set_header Host ai.wiseliang.cloud;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Tailscale-User-Login "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;
    }
    location / { return 404; }
}
